[project]
name = "urivision"
version = "0.3.0"
description = "VURI — Visual URI Process Language plus URI-addressable runtime, Docker contracts and native OS test lab."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []                    # rdzeń bez zależności; runner wymaga: pip install 'urivision[litellm]'

[project.optional-dependencies]
litellm = ["litellm>=1.40"]
test = ["pytest>=8,<10"]

[project.scripts]
urivision = "urivision.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p wellmanifest_governance"

[tool.wellmanifest]
standard = "0.20.162"
revision = "8e6b51dc91a2ac7e1e771908e0fac5e12da0b9a0"
gate = "project/governance-check.sh"
