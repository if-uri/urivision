name: URI Runtime Native Contract

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Native host probe
        run: python tools/probe_native_host.py --out artifacts/native-host-probe.json
      - name: Native matrix
        run: python tools/run_native_lab_matrix.py --out artifacts/native-lab-matrix.json --markdown artifacts/native-lab-matrix.md --confidence artifacts/native-confidence-gate.md
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-contract-${{ matrix.os }}
          path: artifacts/
