name: Self-hosted Native Smoke

on:
  workflow_dispatch:

jobs:
  windows-uia:
    runs-on: [self-hosted, windows, uia]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - shell: powershell
        run: native\windows\run_smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-uia-native
          path: artifacts/

  macos-ax:
    runs-on: [self-hosted, macos, ax]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install -e .
      - run: native/macos/run_smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-ax-native
          path: artifacts/

  linux-wayland:
    runs-on: [self-hosted, linux, wayland]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install -e .
      - run: URIVISION_NATIVE_PROFILE=ubuntu-24-04-wayland native/linux/run_smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-wayland-native
          path: artifacts/

  android-adb:
    runs-on: [self-hosted, android, adb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install -e .
      - run: native/android/probe_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-adb-native
          path: artifacts/
